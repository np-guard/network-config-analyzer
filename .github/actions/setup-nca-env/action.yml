name: 'Setup NCA environment'
description: 'Checks out NCA, then installs the required dependencies'
runs:
  using: "composite"
  steps:
  - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
    with:
      python-version: 3.9
      architecture: x64
      cache: pip
  - run: pip install -r requirements.txt
    shell: bash
